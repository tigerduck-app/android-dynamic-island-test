org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# AGP 9.0+ compiles Kotlin itself. Default is already true; stated for clarity.
android.builtInKotlin=true
kotlin.code.style=official

# AGP rejects JDK 26 (our shell default). Point Gradle at the JDK that ships
# inside Android Studio. Machine-specific — would not be committed on a team.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
